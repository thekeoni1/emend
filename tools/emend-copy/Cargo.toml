[package]
name = "emend-copy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The corpus runner takes any copy tool through --passthrough, so this one goes
# through scripts/passthrough-run.sh unchanged (specs/0008-zip-layer.md,
# "Harness runs"). It links the core and nothing else: the zip crate arrives
# transitively, so the tool adds no dependency of its own.
#
# It enables the core's `dates` feature for --date-sample
# (specs/0012-styles.md, "Harness runs"); the feature has no dependency.
# It enables the core's `rowcol` feature for the row and column samples
# (specs/0018-rows-and-columns.md, decision 7 A), which has none either.
# It enables the core's `metadata` feature for --names-sample
# (specs/0019-names-links-properties-protection.md, decision 1 A), which has
# none either.
# It enables the core's `rules` feature for --validate-sample
# (specs/0020-validation-and-conditional-formatting.md, decision 1 A), which
# has none either.
# It enables the core's `tables` feature for --table-sample
# (specs/0021-tables.md, decision 2 A), which has none either.
# It enables the core's `comments` feature for --comment-sample
# (specs/0022-comments-and-images.md, decision 1 A), which has none either.
# It enables the core's `images` feature for --image-sample
# (specs/0022-comments-and-images.md, decision 1 A), which has none either.
# It enables the core's `richtext` feature for --richtext-sample
# (specs/0024-rich-text.md, decision 1 A), which has none either.
# It enables the core's `sheetprops` feature for --sheetview-sample
# (specs/0025-sheet-and-print-settings.md, decision 1 A), which has none
# either.
[dependencies]
emend = { path = "../../crates/emend", features = ["dates", "rowcol", "metadata", "rules", "tables", "comments", "images", "richtext", "sheetprops"] }
