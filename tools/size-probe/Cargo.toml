[package]
name = "size-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "=0.42.0", default-features = false, optional = true }
# emend's core, for the three emend probes (specs/0008-zip-layer.md, "Size").
# Optional, so probe-zip and probe-zip-xml are built exactly as the baseline
# built them, with nothing of emend compiled in.
emend = { path = "../../crates/emend", optional = true }

[features]
# Enables quick-xml, for probe-zip-xml, probe-zip-xml-write,
# probe-emend-edit-xml, probe-emend-package-xml, probe-emend-cells-xml,
# probe-emend-cells-write-xml, probe-emend-styles-write-xml,
# probe-emend-formulas-write-xml, probe-emend-dates-write-xml,
# probe-emend-sheets-write-xml, probe-emend-fullstyles-write-xml and
# probe-emend-format-write-xml; probe-zip is built without it.
xml = ["dep:quick-xml"]
# Enables emend, for probe-emend-copy, probe-emend-edit,
# probe-emend-edit-xml, probe-emend-package-xml, probe-emend-cells-xml,
# probe-emend-cells-write-xml, probe-emend-styles-write-xml,
# probe-emend-formulas-write-xml, probe-emend-dates-write-xml,
# probe-emend-sheets-write-xml, probe-emend-fullstyles-write-xml and
# probe-emend-format-write-xml.
emend = ["dep:emend"]
# Enables emend's own `dates` feature, for probe-emend-dates-write-xml alone
# (specs/0012-styles.md, "Planning rulings during P3", ruling 7). Each probe
# is built with its own feature set, so no other probe links it.
dates = ["emend", "xml", "emend/dates"]
# Enables emend's own `rowcol` feature, for probe-emend-rowcol-write-xml
# alone (specs/0018-rows-and-columns.md, "Size", under decision 7 A), built
# with its own feature set as the dates probe is.
rowcol = ["emend", "xml", "emend/rowcol"]
# Enables emend's own `metadata` feature, for
# probe-emend-metadata-write-xml alone
# (specs/0019-names-links-properties-protection.md, "Size", under decision
# 1 A), built with its own feature set as the rowcol probe is.
metadata = ["emend", "xml", "emend/metadata"]
# Enables emend's own `rules` feature, for probe-emend-rules-write-xml alone
# (specs/0020-validation-and-conditional-formatting.md, "Size", under
# decision 1 A), built with its own feature set as the metadata probe is.
rules = ["emend", "xml", "emend/rules"]
# Enables emend's own `tables` feature, for probe-emend-tables-write-xml
# alone (specs/0021-tables.md, "Size", under decision 2 A), built with its
# own feature set as the rules probe is.
tables = ["emend", "xml", "emend/tables"]
# Enables emend's own `comments` feature, for
# probe-emend-comments-write-xml alone (specs/0022-comments-and-images.md,
# "Size", under decision 1 A), built with its own feature set as the tables
# probe is.
comments = ["emend", "xml", "emend/comments"]
# Enables emend's own `images` feature, for probe-emend-images-write-xml
# alone (specs/0022-comments-and-images.md, "Size", under decision 1 A),
# built with its own feature set as the comments probe is.
images = ["emend", "xml", "emend/images"]
# Enables emend's own `richtext` feature, for probe-emend-richtext-write-xml
# alone, and with `comments` for probe-emend-richcomment-write-xml
# (specs/0024-rich-text.md, "Size", under decision 1 A), each built with its
# own feature set as the comments probe is.
richtext = ["emend", "xml", "emend/richtext"]
# Enables emend's own `sheetprops` feature, for
# probe-emend-sheetprops-write-xml alone, and with `metadata` for
# probe-emend-printnames-write-xml (specs/0025-sheet-and-print-settings.md,
# "Size", under decision 1 A), each built with its own feature set as the
# richtext probes are.
sheetprops = ["emend", "xml", "emend/sheetprops"]
# Enables emend's own `read` feature, for probe-emend-read-write-xml alone
# (specs/0027-read-back.md, "Size", under decision 1 A), built with its own
# feature set as the sheetprops probe is.
read = ["emend", "xml", "emend/read"]
# Enables emend's own `copy` feature, for probe-emend-copy-write-xml alone,
# and with `comments` for probe-emend-copycomments-write-xml
# (specs/0028-images-and-comments-second-half.md, "Size", under decision 1
# A), each built with its own feature set as the richtext probes are.
copy = ["emend", "xml", "emend/copy"]

[[bin]]
name = "probe-zip"
path = "src/bin/probe-zip.rs"

[[bin]]
name = "probe-zip-xml"
path = "src/bin/probe-zip-xml.rs"
required-features = ["xml"]

[[bin]]
